services:
  - type: web
    name: veilleia
    runtime: python
    plan: free
    # Le runtime Python natif de Render fournit aussi Node — le build front
    # (Vite) est fait ici et servi statiquement par FastAPI (frontend/dist).
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: INSEE_SIRENE_API_KEY
        sync: false
